<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FloodWire — Live Flood Intelligence</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #30363d;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --accent:    #2ea8ff;

      /* Gauge status colors */
      --c-normal:  #3fb68a;
      --c-watch:   #e8c547;
      --c-warning: #f07c3a;
      --c-major:   #e03c3c;
      --c-unknown: #555e6b;

      /* HEFS exceedance probability colors */
      --c-hefs-low:    #38bdf8;   /* <10% chance — sky blue */
      --c-hefs-mod:    #818cf8;   /* 10-25% — indigo */
      --c-hefs-high:   #f472b6;   /* 25-50% — pink */
      --c-hefs-vhigh:  #fb923c;   /* 50-75% — orange */
      --c-hefs-extreme:#ef4444;   /* >75% — red */

      /* Flood news dot */
      --c-news:    #a855f7;
    }

    html, body { height: 100%; font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ── Header ── */
    header {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.6rem 1.2rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      flex-shrink: 0;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 1.25rem;
      color: var(--accent); letter-spacing: -0.02em;
    }
    .logo span { color: var(--text); }

    .header-badges { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .badge {
      font-size: 0.65rem; font-weight: 500;
      padding: 0.18rem 0.55rem;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      display: flex; align-items: center; gap: 0.35rem;
    }
    .badge .dot {
      width: 7px; height: 7px; border-radius: 50%;
      display: inline-block; flex-shrink: 0;
    }

    .header-right { margin-left: auto; display: flex; align-items: center; gap: 0.75rem; }

    /* Param toggle */
    .param-toggle { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .param-toggle button {
      background: var(--bg); border: none; color: var(--muted);
      font-family: 'DM Mono', monospace; font-size: 0.65rem;
      padding: 0.3rem 0.65rem; cursor: pointer; transition: all 0.15s;
    }
    .param-toggle button.active { background: var(--accent); color: #fff; }

    /* Status pill */
    #status {
      font-size: 0.62rem; color: var(--muted);
      white-space: nowrap;
    }

    /* ── Map ── */
    #map { height: 100%; width: 100%; }

    /* ── Legend ── */
    #legend {
      position: absolute; bottom: 28px; left: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      z-index: 500;
      font-size: 0.65rem;
      min-width: 160px;
    }
    #legend h4 {
      font-family: 'Syne', sans-serif;
      font-size: 0.7rem; font-weight: 700;
      color: var(--accent); margin-bottom: 0.6rem;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .legend-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-sep { border-top: 1px solid var(--border); margin: 0.5rem 0; }

    /* ── Popup ── */
    .leaflet-popup-content-wrapper {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5) !important;
      color: var(--text) !important;
      font-family: 'DM Mono', monospace !important;
      font-size: 0.78rem !important;
    }
    .leaflet-popup-tip { background: var(--surface) !important; }
    .leaflet-popup-close-button { color: var(--muted) !important; }

    .popup-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 0.9rem;
      color: var(--accent); margin-bottom: 0.5rem;
      line-height: 1.3;
    }
    .popup-row { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 0.25rem; }
    .popup-label { color: var(--muted); }
    .popup-val { color: var(--text); font-weight: 500; }
    .popup-link {
      display: inline-block; margin-top: 0.6rem;
      color: var(--accent); text-decoration: none; font-size: 0.7rem;
    }
    .popup-link:hover { text-decoration: underline; }

    /* ── Loader overlay ── */
    #loader {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Syne', sans-serif; font-size: 0.8rem;
      color: var(--muted); z-index: 600;
      pointer-events: none;
      opacity: 0; transition: opacity 0.2s;
    }
    #loader.visible { opacity: 1; }

    /* Override cluster colors */
    /* Clusters: white/steel — neutral, distinct from green/yellow/red legend and purple news dots */
    .marker-cluster-small  { background-color: rgba(200,210,220,0.15) !important; }
    .marker-cluster-small div { background-color: rgba(180,195,210,0.75) !important; color: #0d1117 !important; }
    .marker-cluster-medium { background-color: rgba(140,160,180,0.15) !important; }
    .marker-cluster-medium div { background-color: rgba(120,145,170,0.8) !important; color: #0d1117 !important; }
    .marker-cluster-large  { background-color: rgba(80,110,140,0.2) !important; }
    .marker-cluster-large div { background-color: rgba(60,90,120,0.9) !important; color: #fff !important; }
    /* Filter toggle rows in legend */
    .filter-row {
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
      padding: 0.15rem 0.2rem;
      transition: opacity 0.2s;
    }
    .filter-row:hover { background: rgba(255,255,255,0.05); }
    .filter-row input[type="checkbox"] {
      width: 11px; height: 11px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    .filter-row.dimmed { opacity: 0.4; }

    .marker-cluster div { font-family: 'DM Mono', monospace !important; font-size: 0.7rem !important; font-weight: 600 !important; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Flood<span>Wire</span></div>

    <div class="header-badges">
      <span class="badge"><span class="dot" style="background:var(--c-news)"></span>Flood News</span>
      <span class="badge"><span class="dot" style="background:#38bdf8"></span>HEFS Forecast</span>
      <span class="badge"><span class="dot" style="background:var(--c-normal)"></span>USGS Normal</span>
      <span class="badge"><span class="dot" style="background:var(--c-watch)"></span>Watch</span>
      <span class="badge"><span class="dot" style="background:var(--c-warning)"></span>Warning</span>
      <span class="badge"><span class="dot" style="background:var(--c-major)"></span>Major</span>
    </div>

    <div class="header-right">
      <div class="param-toggle">
        <button class="active" data-param="00065" title="Gage height (ft)">HEIGHT</button>
        <button data-param="00060" title="Streamflow (cfs)">FLOW</button>
      </div>
      <span id="status">Loading…</span>
    </div>
  </header>

  <div style="position:relative; flex:1; height:0; min-height:0;">
    <div id="map"></div>

    <div id="legend">
      <h4>USGS Gauges</h4>
      <label class="legend-row filter-row" data-bucket="normal">
        <input type="checkbox" checked data-bucket="normal">
        <div class="legend-dot" style="background:var(--c-normal)"></div>
        <span>Normal (&lt;5 ft)</span>
      </label>
      <label class="legend-row filter-row" data-bucket="watch">
        <input type="checkbox" checked data-bucket="watch">
        <div class="legend-dot" style="background:var(--c-watch)"></div>
        <span>Watch (5–10 ft)</span>
      </label>
      <label class="legend-row filter-row" data-bucket="warning">
        <input type="checkbox" checked data-bucket="warning">
        <div class="legend-dot" style="background:var(--c-warning)"></div>
        <span>Warning (10–15 ft)</span>
      </label>
      <label class="legend-row filter-row" data-bucket="major">
        <input type="checkbox" checked data-bucket="major">
        <div class="legend-dot" style="background:var(--c-major)"></div>
        <span>Major (&gt;15 ft)</span>
      </label>
      <label class="legend-row filter-row" data-bucket="unknown">
        <input type="checkbox" checked data-bucket="unknown">
        <div class="legend-dot" style="background:var(--c-unknown)"></div>
        <span>Unknown</span>
      </label>
      <div class="legend-sep"></div>
      <div class="legend-row" style="margin-bottom:0.25rem; font-size:0.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;">HEFS Forecasts</div>
      <label class="legend-row filter-row" id="hefs-toggle-row" style="margin-bottom:0.25rem;">
        <input type="checkbox" id="hefs-toggle">
        <div class="legend-dot" style="background:#38bdf8"></div>
        <span>Show HEFS sites</span>
      </label>
      <div style="font-size:0.6rem; color:var(--muted); margin-bottom:0.35rem; padding-left:1.2rem; line-height:1.4;">
        ◆ = flood exceedance prob<br>click site for p10/p50/p90
      </div>
      <div class="legend-row" style="gap:0.3rem; flex-wrap:wrap; margin-bottom:0.1rem;">
        <span style="font-size:0.58rem; background:#38bdf8; color:#000; padding:0.1rem 0.35rem; border-radius:3px;">&lt;10%</span>
        <span style="font-size:0.58rem; background:#818cf8; color:#fff; padding:0.1rem 0.35rem; border-radius:3px;">10-25%</span>
        <span style="font-size:0.58rem; background:#f472b6; color:#000; padding:0.1rem 0.35rem; border-radius:3px;">25-50%</span>
        <span style="font-size:0.58rem; background:#fb923c; color:#fff; padding:0.1rem 0.35rem; border-radius:3px;">50-75%</span>
        <span style="font-size:0.58rem; background:#ef4444; color:#fff; padding:0.1rem 0.35rem; border-radius:3px;">&gt;75%</span>
      </div>
      <div class="legend-sep"></div>
      <div class="legend-row" style="margin-bottom:0.4rem; font-size:0.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;">State Filter</div>
      <div style="display:flex; gap:0.4rem; align-items:center; margin-bottom:0.1rem;">
        <select id="state-select" style="flex:1; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:4px; font-family:'DM Mono',monospace; font-size:0.65rem; padding:0.25rem 0.4rem; cursor:pointer;">
          <option value="ALL">All States</option>
        </select>
        <button id="state-clear" title="Clear" style="background:none; border:1px solid var(--border); border-radius:4px; color:var(--muted); font-size:0.65rem; padding:0.2rem 0.4rem; cursor:pointer;">✕</button>
      </div>
      <div class="legend-sep"></div>
      <div class="legend-row" style="margin-bottom:0.25rem; font-size:0.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;">Flood News</div>
      <label class="legend-row filter-row" id="news-24h-row" style="margin-bottom:0;">
        <input type="checkbox" id="news-24h-toggle">
        <div class="legend-dot" style="background:var(--c-news)"></div>
        <span>Last 24 hours only</span>
      </label>
    </div>

    <div id="loader">Fetching gauges…</div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const FLOODS_GEOJSON = 'https://raw.githubusercontent.com/rmkenv/floodwire2/main/data/floods.geojson';
// National fetch — all active USGS stream gauges, gage height, last 2 hours
// ~8-10k sites; USGS IV supports CORS so we call directly from the browser
const USGS_NATIONAL  =
  'https://waterservices.usgs.gov/nwis/iv/' +
  '?format=json&parameterCd=00065&siteStatus=active&period=PT2H';

// ── Color map ─────────────────────────────────────────────────────────────────
const BUCKET_COLORS = {
  normal:  '#3fb68a',
  watch:   '#e8c547',
  warning: '#f07c3a',
  major:   '#e03c3c',
  unknown: '#555e6b'
};

// ── Init map ──────────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [38.5, -92.0],   // center of CONUS
  zoom: 4,
  zoomControl: true,
  preferCanvas: true        // faster for ~10k circle markers
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// ── Layers ────────────────────────────────────────────────────────────────────
const newsLayer = L.layerGroup().addTo(map);
let allNewsMarkers = []; // [{marker, ts}] — ts is Date or null

const gaugeCluster = L.markerClusterGroup({
  chunkedLoading: true,
  maxClusterRadius: 50,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  disableClusteringAtZoom: 10
});
gaugeCluster.addTo(map);

// ── Status helpers ────────────────────────────────────────────────────────────
const statusEl = document.getElementById('status');
const loaderEl = document.getElementById('loader');
let gaugeCount = 0;
let newsCount  = 0;

function setStatus(gaugeN, newsN) {
  if (gaugeN != null) gaugeCount = gaugeN;
  if (newsN  != null) newsCount  = newsN;
  statusEl.textContent = gaugeCount + ' gauges · ' + newsCount + ' news events';
}

// ── Gauge classification ──────────────────────────────────────────────────────
function classifyGauge(ft) {
  if (isNaN(ft) || ft < 0) return 'unknown';
  if (ft < 5)  return 'normal';
  if (ft < 10) return 'watch';
  if (ft < 15) return 'warning';
  return 'major';
}

// ── Load flood news (once) ────────────────────────────────────────────────────
function applyNewsFilter() {
  const only24h = document.getElementById('news-24h-toggle').checked;
  const cutoff  = Date.now() - 24 * 60 * 60 * 1000;
  newsLayer.clearLayers();
  let visible = 0;
  allNewsMarkers.forEach(({ marker, ts }) => {
    const show = !only24h || (ts && ts.getTime() >= cutoff);
    if (show) { newsLayer.addLayer(marker); visible++; }
  });
  const label = only24h ? visible + ' news (24h)' : allNewsMarkers.length + ' news events';
  statusEl.textContent = (allMarkers.length ? allMarkers.filter(({bucket}) =>
    [...document.querySelectorAll('.filter-row input:checked')].map(e=>e.dataset.bucket).includes(bucket)
  ).length + ' of ' + allMarkers.length + ' gauges · ' : '') + label;
}

async function loadFloodNews() {
  try {
    const res   = await fetch(FLOODS_GEOJSON);
    if (!res.ok) throw new Error(res.status);
    const gj    = await res.json();
    const feats = gj.features || [];
    feats.forEach(f => {
      const [lng, lat] = f.geometry.coordinates;
      const p  = f.properties;
      const ts = p.published_at ? new Date(p.published_at) : null;
      const marker = L.circleMarker([lat, lng], {
        radius: 7, fillColor: '#a855f7', color: '#fff',
        weight: 1.5, opacity: 1, fillOpacity: 0.85
      });
      const dt = ts
        ? ts.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        : '—';
      marker.bindPopup(
        '<div class="popup-title">' + escHtml(p.title || 'Flood Event') + '</div>' +
        '<div class="popup-row"><span class="popup-label">Source</span><span class="popup-val">' + escHtml(p.source || '—') + '</span></div>' +
        '<div class="popup-row"><span class="popup-label">Type</span><span class="popup-val">' + escHtml(p.flood_type || '—') + '</span></div>' +
        '<div class="popup-row"><span class="popup-label">Published</span><span class="popup-val">' + dt + '</span></div>' +
        '<a class="popup-link" href="' + escHtml(p.url || '#') + '" target="_blank" rel="noopener">→ Read article</a>'
      );
      allNewsMarkers.push({ marker, ts });
      newsLayer.addLayer(marker);
    });
    setStatus(null, feats.length);
  } catch (e) {
    console.error('Flood news error:', e);
  }
}

// ── Load ALL USGS gauges — fetch each state in parallel ───────────────────────
// The USGS IV service requires a "major filter" (stateCd, bBox, or sites list).
// A bare national query returns HTTP 400. Solution: fan out across all 50 states.
const US_STATES = [
  'AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA',
  'HI','ID','IL','IN','IA','KS','KY','LA','ME','MD',
  'MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ',
  'NM','NY','NC','ND','OH','OK','OR','PA','RI','SC',
  'SD','TN','TX','UT','VT','VA','WA','WV','WI','WY',
  'PR','VI','GU'  // territories
];

let currentParam = '00065';

function buildStateUrl(stateCd, param) {
  return 'https://waterservices.usgs.gov/nwis/iv/' +
    '?format=json' +
    '&stateCd=' + stateCd +
    '&parameterCd=' + param +
    '&siteStatus=active' +
    '&period=PT2H';
}

// Global marker store for filtering without re-fetching
let allMarkers = []; // [{marker, bucket}]

function applyFilters() {
  const activeBuckets = new Set(
    [...document.querySelectorAll('.filter-row input[data-bucket]:checked')].map(el => el.dataset.bucket)
  );
  gaugeCluster.clearLayers();
  let visible = 0;
  allMarkers.forEach(({ marker, bucket, state }) => {
    const stateOk  = activeStates.size === 0 || activeStates.has(state);
    const bucketOk = activeBuckets.has(bucket);
    if (stateOk && bucketOk) { gaugeCluster.addLayer(marker); visible++; }
  });
  document.querySelectorAll('.filter-row[data-bucket]').forEach(row => {
    row.classList.toggle('dimmed', !activeBuckets.has(row.dataset.bucket));
  });
  statusEl.textContent = visible + ' of ' + allMarkers.length + ' gauges · ' + allNewsMarkers.length + ' news events';
}

function parseTimeSeries(series, param, state) {
  const markers = [];
  series.forEach(ts => {
    const site = ts.sourceInfo;
    const geo  = site?.geoLocation?.geogLocation;
    if (!geo) return;
    const lat = parseFloat(geo.latitude);
    const lng = parseFloat(geo.longitude);
    if (isNaN(lat) || isNaN(lng)) return;

    const vals   = ts.values?.[0]?.value || [];
    const latest = vals[vals.length - 1];
    const val    = latest ? parseFloat(latest.value) : NaN;
    if (isNaN(val) || val === -999999) return;

    const bucket   = classifyGauge(val);
    const color    = BUCKET_COLORS[bucket];
    const unit     = param === '00065' ? 'ft' : 'cfs';
    const siteCode = site.siteCode?.[0]?.value || '';
    const siteName = site.siteName || siteCode || 'USGS Gauge';
    const dt = latest?.dateTime
      ? new Date(latest.dateTime).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      : '—';

    const marker = L.circleMarker([lat, lng], {
      radius: 5, fillColor: color, color: '#fff',
      weight: 1, opacity: 1, fillOpacity: 0.9
    });
    marker.bindPopup(
      '<div class="popup-title">' + escHtml(siteName) + '</div>' +
      '<div class="popup-row"><span class="popup-label">' + (param === '00065' ? 'Gage height' : 'Streamflow') + '</span>' +
      '<span class="popup-val" style="color:' + color + '">' + val.toFixed(2) + ' ' + unit + '</span></div>' +
      '<div class="popup-row"><span class="popup-label">Status</span><span class="popup-val">' + bucket + '</span></div>' +
      '<div class="popup-row"><span class="popup-label">Updated</span><span class="popup-val">' + dt + '</span></div>' +
      (siteCode ? '<a class="popup-link" href="https://waterdata.usgs.gov/monitoring-location/' + siteCode + '" target="_blank" rel="noopener">→ USGS page</a>' : '')
    );
    markers.push({ marker, bucket, state });
  });
  return markers;
}

// ── State filter ─────────────────────────────────────────────────────────────
let activeStates = new Set([]); // empty = all states shown

function applyStateFilter() {
  const sel = document.getElementById('state-select').value;
  activeStates = sel === 'ALL' ? new Set([]) : new Set([sel]);
  const activeBuckets = new Set(
    [...document.querySelectorAll('.filter-row input[data-bucket]:checked')].map(e => e.dataset.bucket)
  );
  gaugeCluster.clearLayers();
  let visible = 0;
  allMarkers.forEach(({ marker, bucket, state }) => {
    const stateOk  = activeStates.size === 0 || activeStates.has(state);
    const bucketOk = activeBuckets.has(bucket);
    if (stateOk && bucketOk) { gaugeCluster.addLayer(marker); visible++; }
  });
  statusEl.textContent = visible + ' of ' + allMarkers.length + ' gauges · ' + allNewsMarkers.length + ' news events';
}

async function loadGauges() {
  allMarkers = [];
  gaugeCluster.clearLayers();
  loaderEl.classList.add('visible');
  statusEl.textContent = 'Loading gauges (0 / ' + US_STATES.length + ')…';

  const param = currentParam;
  let totalCount = 0;
  let doneCount  = 0;

  // Fetch all states concurrently, add markers as each resolves
  const promises = US_STATES.map(async state => {
    try {
      const res = await fetch(buildStateUrl(state, param));
      if (!res.ok) return;
      const data   = await res.json();
      const series = data?.value?.timeSeries || [];
      const marks  = parseTimeSeries(series, param, state);
      marks.forEach(obj => {
        allMarkers.push(obj);
        gaugeCluster.addLayer(obj.marker);
        if (!activeStates.has(state)) gaugeCluster.removeLayer(obj.marker);
      });
      totalCount += marks.length;
    } catch (e) {
      // silently skip failed states
    } finally {
      doneCount++;
      statusEl.textContent = 'Loading gauges (' + doneCount + ' / ' + US_STATES.length + ')…';
    }
  });

  await Promise.all(promises);
  setStatus(totalCount, null);
  loaderEl.classList.remove('visible');
}

// ── Param toggle ──────────────────────────────────────────────────────────────

// ── Utility ───────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── HEFS Layer ───────────────────────────────────────────────────────────────
// NOTE: api.water.noaa.gov/hefs/v1 is experimental — individual RFCs may be
// unavailable on an intermittent basis (NWS PNS24-77, extended through Sep 2026).
// This code is written to degrade gracefully when the API is down or slow.

const HEFS_BASE      = 'https://api.water.noaa.gov/hefs/v1';
const HEFS_LOCATIONS = HEFS_BASE + '/locations/?limit=500&offset=';  // paginated
const HEFS_FORECAST  = HEFS_BASE + '/forecasts/';
const HEFS_TIMEOUT_MS = 12000;   // 12 s per request before we give up
const HEFS_MAX_RETRIES = 2;

let hefsLayer   = L.layerGroup();
let hefsLoaded  = false;
let hefsLoading = false;

const HEFS_COLORS = {
  low:     '#38bdf8',
  mod:     '#818cf8',
  high:    '#f472b6',
  vhigh:   '#fb923c',
  extreme: '#ef4444',
  unknown: '#94a3b8'
};

function hefsExceedanceColor(prob) {
  if (prob === null || prob === undefined || isNaN(prob)) return HEFS_COLORS.unknown;
  if (prob < 10)  return HEFS_COLORS.low;
  if (prob < 25)  return HEFS_COLORS.mod;
  if (prob < 50)  return HEFS_COLORS.high;
  if (prob < 75)  return HEFS_COLORS.vhigh;
  return HEFS_COLORS.extreme;
}

// Fetch with timeout + optional retry
async function fetchWithTimeout(url, timeoutMs, retries) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(tid);
      return res;
    } catch (e) {
      clearTimeout(tid);
      if (attempt === retries) throw e;
      await new Promise(r => setTimeout(r, 800 * (attempt + 1))); // back-off
    }
  }
}

// Paginate through /locations — avoids a single 5000-row request that can time out
async function fetchAllHEFSLocations() {
  const PAGE      = 500;
  const MAX_PAGES = 20;   // safety cap: 20 × 500 = 10,000 locations max, prevents infinite loop
  let offset = 0;
  let all = [];
  for (let pageNum = 0; pageNum < MAX_PAGES; pageNum++) {
    const url = HEFS_LOCATIONS + offset;
    const res = await fetchWithTimeout(url, HEFS_TIMEOUT_MS, HEFS_MAX_RETRIES);
    if (!res.ok) throw new Error('HEFS locations HTTP ' + res.status);
    const data = await res.json();

    // Normalise — API may return array or {locations:[…]} or {data:[…]}
    const page = Array.isArray(data) ? data : (data.locations || data.data || []);

    // Debug: log first-page shape once so you can inspect actual API response
    // in DevTools console when the API is live. Remove once schema is confirmed.
    if (pageNum === 0) {
      console.debug('[HEFS] locations page 0 raw keys:', Object.keys(Array.isArray(data) ? {_array:true} : data));
      console.debug('[HEFS] locations page 0 first item:', page[0] ?? '(empty)');
    }

    all = all.concat(page);
    if (page.length < PAGE) break;   // last page — fewer results than page size
    offset += PAGE;
  }
  return all;
}

async function fetchHEFSForecast(lid) {
  try {
    const url = HEFS_FORECAST + lid + '/quantiles/?type=max&duration=10d';
    const res = await fetchWithTimeout(url, HEFS_TIMEOUT_MS, HEFS_MAX_RETRIES);
    if (!res.ok) return null;
    const data = await res.json();

    // Quantiles: probe multiple possible shapes the experimental API has used
    // Debug: log raw response shape once per session to confirm field names when API is live.
    // Check DevTools console. Remove once schema is confirmed stable.
    if (!window._hefsFcDebugDone) {
      console.debug('[HEFS] forecast raw response sample:', JSON.stringify(data).slice(0, 500));
      window._hefsFcDebugDone = true;
    }

    const qs =
      data?.quantiles ??
      data?.data?.quantiles ??
      data?.forecast?.quantiles ??
      [];

    const find = (q) => {
      const match = qs.find(x => Math.abs((x.quantile ?? x.p) - q) < 0.01);
      return match ? parseFloat(match.value ?? match.v).toFixed(1) : '—';
    };

    // Exceedance probability: probe every field name seen in swagger + redoc
    // The API stores this as a 0–1 fraction OR a 0–100 integer depending on RFC.
    let excProb =
      data?.exceedanceProbability ??
      data?.flood_exceedance_probability ??
      data?.floodExceedanceProbability ??
      data?.data?.exceedanceProbability ??
      data?.forecast?.exceedanceProbability ??
      null;

    // If it came back as a 0–1 fraction, convert to 0–100
    if (excProb !== null) {
      excProb = parseFloat(excProb);
      if (!isNaN(excProb) && excProb <= 1.0) excProb = excProb * 100;
      excProb = Math.round(excProb);
    }

    // Fallback: derive exceedance from ensemble members if top-level field absent
    // Some RFC responses nest members under data.members[].maxValue
    if (excProb === null) {
      const members =
        data?.members ?? data?.data?.members ?? data?.forecast?.members ?? [];
      if (members.length > 0) {
        // floodStage not always present; skip derivation if missing
        const floodStage = data?.floodStage ?? data?.flood_stage ?? null;
        if (floodStage !== null) {
          const fs = parseFloat(floodStage);
          const exceed = members.filter(m => parseFloat(m.maxValue ?? m.max_value ?? 0) >= fs).length;
          excProb = Math.round((exceed / members.length) * 100);
        }
      }
    }

    return {
      p10: find(0.1),
      p50: find(0.5),
      p90: find(0.9),
      exceedanceProb: excProb,
      units: data?.units ?? data?.unit ?? 'kcfs'
    };
  } catch(e) {
    console.warn('HEFS forecast fetch failed for ' + lid + ':', e.message);
    return null;
  }
}

function makeDiamondIcon(color) {
  return L.divIcon({
    className: '',
    html: '<div style="width:10px;height:10px;background:' + color + ';border:1.5px solid #fff;transform:rotate(45deg);opacity:0.9;"></div>',
    iconSize: [10, 10],
    iconAnchor: [5, 5]
  });
}

async function loadHEFS() {
  if (hefsLoaded || hefsLoading) return;
  hefsLoading = true;
  statusEl.textContent = 'Loading HEFS forecast sites…';

  try {
    const locs = await fetchAllHEFSLocations();

    if (locs.length === 0) {
      throw new Error('No locations returned — RFC data may be temporarily unavailable');
    }

    locs.forEach(loc => {
      const lat  = parseFloat(loc.latitude  ?? loc.lat);
      const lng  = parseFloat(loc.longitude ?? loc.lon ?? loc.lng);
      const lid  = loc.lid ?? loc.id ?? loc.locationId ?? loc.nwsLid;
      const name = loc.name ?? loc.locationName ?? loc.nwsName ?? lid ?? 'HEFS Site';
      if (isNaN(lat) || isNaN(lng) || !lid) return;

      const marker = L.marker([lat, lng], { icon: makeDiamondIcon(HEFS_COLORS.unknown) });

      marker.on('click', async () => {
        marker.bindPopup(
          '<div class="popup-title">' + escHtml(name) + '</div>' +
          '<div style="color:var(--muted);font-size:0.7rem;">Loading HEFS forecast…</div>'
        ).openPopup();

        const fc    = await fetchHEFSForecast(lid);
        const prob  = fc?.exceedanceProb ?? null;
        const color = hefsExceedanceColor(prob);
        const units = fc?.units ?? '';

        marker.setIcon(makeDiamondIcon(color));

        const probStr = prob !== null ? prob + '%' : 'unavailable';
        const probStyle = 'color:' + color;

        // Note if forecast data was absent (RFC offline)
        const fcNote = !fc
          ? '<div style="font-size:0.62rem;color:var(--muted);margin-top:0.4rem;">⚠ Forecast data unavailable — RFC may be offline</div>'
          : '';

        marker.setPopupContent(
          '<div class="popup-title">' + escHtml(name) + '</div>' +
          '<div style="font-size:0.65rem;color:var(--muted);margin-bottom:0.4rem;">HEFS 10-day Ensemble Forecast</div>' +
          '<div class="popup-row"><span class="popup-label">Flood Exceedance</span><span class="popup-val" style="' + probStyle + '">' + probStr + '</span></div>' +
          '<div class="popup-row"><span class="popup-label">p10 (low)</span><span class="popup-val">' + (fc?.p10 ?? '—') + (fc ? ' ' + units : '') + '</span></div>' +
          '<div class="popup-row"><span class="popup-label">p50 (median)</span><span class="popup-val">' + (fc?.p50 ?? '—') + (fc ? ' ' + units : '') + '</span></div>' +
          '<div class="popup-row"><span class="popup-label">p90 (high)</span><span class="popup-val">' + (fc?.p90 ?? '—') + (fc ? ' ' + units : '') + '</span></div>' +
          '<div class="popup-row"><span class="popup-label">Location ID</span><span class="popup-val">' + escHtml(lid) + '</span></div>' +
          fcNote +
          '<a class="popup-link" href="https://water.noaa.gov/gauges/' + encodeURIComponent(lid) + '" target="_blank" rel="noopener">→ NWPS page</a>'
        );
        marker.openPopup();
      });

      hefsLayer.addLayer(marker);
    });

    hefsLoaded  = true;
    hefsLoading = false;
    statusEl.textContent = locs.length + ' HEFS sites loaded';

  } catch(e) {
    console.error('HEFS load error:', e);
    // User-visible: distinguish "API down" from other errors
    const msg = (e.name === 'AbortError' || e.message.includes('timed out'))
      ? 'HEFS API timed out — RFC data temporarily unavailable'
      : 'HEFS unavailable: ' + e.message;
    statusEl.textContent = msg;

    // Show a legend note so the user knows it's an upstream issue
    const toggleRow = document.getElementById('hefs-toggle-row');
    if (toggleRow && !document.getElementById('hefs-api-note')) {
      const note = document.createElement('div');
      note.id = 'hefs-api-note';
      note.style.cssText = 'font-size:0.58rem;color:#fb923c;padding-left:1.2rem;line-height:1.4;margin-bottom:0.25rem;';
      note.textContent = '⚠ API temporarily unavailable';
      toggleRow.insertAdjacentElement('afterend', note);
    }

    // Uncheck the toggle so the user can retry by toggling again
    document.getElementById('hefs-toggle').checked = false;
    hefsLoading = false;
    // Allow retry on next toggle
    hefsLoaded = false;
  }
}

function toggleHEFS() {
  const on = document.getElementById('hefs-toggle').checked;
  // Clear any previous API error note on re-attempt
  const note = document.getElementById('hefs-api-note');
  if (note) note.remove();

  if (on) {
    hefsLayer.addTo(map);
    loadHEFS();
  } else {
    map.removeLayer(hefsLayer);
    // Allow a fresh load if user toggled off and back on
    if (!hefsLoaded) hefsLoading = false;
  }
}

loadFloodNews();

</script>
