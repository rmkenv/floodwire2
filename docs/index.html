<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FloodWire — Live Flood Intelligence</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #30363d;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --accent:    #2ea8ff;

      /* Gauge status colors */
      --c-normal:  #3fb68a;
      --c-watch:   #e8c547;
      --c-warning: #f07c3a;
      --c-major:   #e03c3c;
      --c-unknown: #555e6b;


      /* Flood news dot */
      --c-news:    #a855f7;
    }

    html, body { height: 100%; font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ── Header ── */
    header {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.6rem 1.2rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      flex-shrink: 0;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 1.25rem;
      color: var(--accent); letter-spacing: -0.02em;
    }
    .logo span { color: var(--text); }

    .header-badges { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .badge {
      font-size: 0.65rem; font-weight: 500;
      padding: 0.18rem 0.55rem;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      display: flex; align-items: center; gap: 0.35rem;
    }
    .badge .dot {
      width: 7px; height: 7px; border-radius: 50%;
      display: inline-block; flex-shrink: 0;
    }

    .header-right { margin-left: auto; display: flex; align-items: center; gap: 0.75rem; }

    /* Param toggle */
    .param-toggle { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .param-toggle button {
      background: var(--bg); border: none; color: var(--muted);
      font-family: 'DM Mono', monospace; font-size: 0.65rem;
      padding: 0.3rem 0.65rem; cursor: pointer; transition: all 0.15s;
    }
    .param-toggle button.active { background: var(--accent); color: #fff; }

    /* Status pill */
    #status {
      font-size: 0.62rem; color: var(--muted);
      white-space: nowrap;
    }

    /* ── Map ── */
    #map { height: 100%; width: 100%; }

    /* ── Legend ── */
    #legend {
      position: absolute; bottom: 28px; left: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      z-index: 500;
      font-size: 0.65rem;
      min-width: 160px;
    }
    #legend h4 {
      font-family: 'Syne', sans-serif;
      font-size: 0.7rem; font-weight: 700;
      color: var(--accent); margin-bottom: 0.6rem;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .legend-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-sep { border-top: 1px solid var(--border); margin: 0.5rem 0; }

    /* ── Popup ── */
    .leaflet-popup-content-wrapper {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5) !important;
      color: var(--text) !important;
      font-family: 'DM Mono', monospace !important;
      font-size: 0.78rem !important;
    }
    .leaflet-popup-tip { background: var(--surface) !important; }
    .leaflet-popup-close-button { color: var(--muted) !important; }

    .popup-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 0.9rem;
      color: var(--accent); margin-bottom: 0.5rem;
      line-height: 1.3;
    }
    .popup-row { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 0.25rem; }
    .popup-label { color: var(--muted); }
    .popup-val { color: var(--text); font-weight: 500; }
    .popup-link {
      display: inline-block; margin-top: 0.6rem;
      color: var(--accent); text-decoration: none; font-size: 0.7rem;
    }
    .popup-link:hover { text-decoration: underline; }

    /* ── Loader overlay ── */
    #loader {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Syne', sans-serif; font-size: 0.8rem;
      color: var(--muted); z-index: 600;
      pointer-events: none;
      opacity: 0; transition: opacity 0.2s;
    }
    #loader.visible { opacity: 1; }

    /* Override cluster colors */
    /* Clusters: white/steel — neutral, distinct from green/yellow/red legend and purple news dots */
    .marker-cluster-small  { background-color: rgba(200,210,220,0.15) !important; }
    .marker-cluster-small div { background-color: rgba(180,195,210,0.75) !important; color: #0d1117 !important; }
    .marker-cluster-medium { background-color: rgba(140,160,180,0.15) !important; }
    .marker-cluster-medium div { background-color: rgba(120,145,170,0.8) !important; color: #0d1117 !important; }
    .marker-cluster-large  { background-color: rgba(80,110,140,0.2) !important; }
    .marker-cluster-large div { background-color: rgba(60,90,120,0.9) !important; color: #fff !important; }
    /* Filter toggle rows in legend */
    .filter-row {
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
      padding: 0.15rem 0.2rem;
      transition: opacity 0.2s;
    }
    .filter-row:hover { background: rgba(255,255,255,0.05); }
    .filter-row input[type="checkbox"] {
      width: 11px; height: 11px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    .filter-row.dimmed { opacity: 0.4; }

    .marker-cluster div { font-family: 'DM Mono', monospace !important; font-size: 0.7rem !important; font-weight: 600 !important; }

    /* ── Flood Chat Panel ── */
    #chat-btn {
      position: absolute; bottom: 28px; right: 12px;
      z-index: 900;
      background: var(--accent); color: #fff;
      border: none; border-radius: 50%;
      width: 46px; height: 46px;
      font-size: 1.3rem; cursor: pointer;
      box-shadow: 0 4px 16px rgba(46,168,255,0.4);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #chat-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(46,168,255,0.55); }

    #chat-panel {
      position: absolute; bottom: 82px; right: 12px;
      width: 360px; max-height: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      z-index: 900;
      display: flex; flex-direction: column;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      overflow: hidden;
      transform: scale(0.92) translateY(12px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }
    #chat-panel.open {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: all;
    }

    #chat-header {
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 0.5rem;
      flex-shrink: 0;
    }
    #chat-header .chat-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 0.85rem;
      color: var(--accent);
    }
    #chat-header .chat-subtitle {
      font-size: 0.58rem; color: var(--muted); margin-left: auto;
    }

    #chat-messages {
      flex: 1; overflow-y: auto;
      padding: 0.75rem;
      display: flex; flex-direction: column; gap: 0.6rem;
      scroll-behavior: smooth;
    }
    #chat-messages::-webkit-scrollbar { width: 4px; }
    #chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .chat-msg {
      font-size: 0.72rem; line-height: 1.55;
      padding: 0.5rem 0.7rem;
      border-radius: 8px;
      max-width: 94%;
    }
    .chat-msg.user {
      background: rgba(46,168,255,0.12);
      border: 1px solid rgba(46,168,255,0.2);
      align-self: flex-end;
      color: var(--text);
    }
    .chat-msg.bot {
      background: var(--bg);
      border: 1px solid var(--border);
      align-self: flex-start;
      color: var(--text);
    }
    .chat-msg.bot.typing { color: var(--muted); font-style: italic; }

    .gauge-card {
      background: rgba(46,168,255,0.06);
      border: 1px solid rgba(46,168,255,0.18);
      border-radius: 6px;
      padding: 0.5rem 0.65rem;
      font-size: 0.67rem;
      margin-bottom: 0.1rem;
      align-self: flex-start;
      max-width: 94%;
    }
    .gauge-card-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.7rem; font-weight: 700;
      color: var(--accent); margin-bottom: 0.35rem;
    }
    .gauge-card-row { display: flex; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.18rem; }
    .gauge-card-label { color: var(--muted); }
    .gauge-card-val { font-weight: 600; }

    #chat-footer {
      padding: 0.6rem 0.75rem;
      border-top: 1px solid var(--border);
      display: flex; gap: 0.5rem;
      flex-shrink: 0;
    }
    #chat-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      padding: 0.4rem 0.6rem;
      outline: none;
      transition: border-color 0.15s;
    }
    #chat-input:focus { border-color: var(--accent); }
    #chat-input::placeholder { color: var(--muted); }

    #chat-send {
      background: var(--accent); color: #fff;
      border: none; border-radius: 6px;
      padding: 0.4rem 0.75rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem; cursor: pointer;
      transition: opacity 0.15s;
    }
    #chat-send:disabled { opacity: 0.4; cursor: default; }
    #chat-send:hover:not(:disabled) { opacity: 0.85; }

    /* ── Suggestion chips ── */
    #chat-chips {
      padding: 0 0.75rem 0.5rem;
      display: flex; flex-wrap: wrap; gap: 0.35rem;
    }
    .chat-chip {
      font-size: 0.62rem; font-family: 'DM Mono', monospace;
      background: rgba(46,168,255,0.08);
      border: 1px solid rgba(46,168,255,0.25);
      color: var(--accent);
      border-radius: 99px;
      padding: 0.2rem 0.6rem;
      cursor: pointer; white-space: nowrap;
      transition: background 0.12s;
    }
    .chat-chip:hover { background: rgba(46,168,255,0.18); }

    /* ── Trend badge ── */
    .trend-badge {
      display: inline-block;
      font-size: 0.6rem; font-family: 'DM Mono', monospace;
      padding: 0.1rem 0.45rem; border-radius: 4px;
      font-weight: 700; margin-left: 0.4rem;
      vertical-align: middle;
    }
    .trend-rising  { background: rgba(239,68,68,0.15);  color: #ef4444; }
    .trend-falling { background: rgba(56,189,248,0.15); color: #38bdf8; }
    .trend-steady  { background: rgba(148,163,184,0.15);color: #94a3b8; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Flood<span>Wire</span></div>

    <div class="header-badges">
      <span class="badge"><span class="dot" style="background:var(--c-news)"></span>Flood News</span>
      <span class="badge"><span class="dot" style="background:var(--c-normal)"></span>USGS Normal</span>
      <span class="badge"><span class="dot" style="background:var(--c-watch)"></span>Watch</span>
      <span class="badge"><span class="dot" style="background:var(--c-warning)"></span>Warning</span>
      <span class="badge"><span class="dot" style="background:var(--c-major)"></span>Major</span>
    </div>

    <div class="header-right">
      <div class="param-toggle">
        <button class="active" data-param="00065" title="Gage height (ft)">HEIGHT</button>
        <button data-param="00060" title="Streamflow (cfs)">FLOW</button>
      </div>
      <span id="status">Loading…</span>
    </div>
  </header>

  <div style="position:relative; flex:1; height:0; min-height:0;">
    <div id="map"></div>

    <div id="legend">
      <h4>USGS Gauges</h4>
      <label class="legend-row filter-row" data-bucket="normal">
        <input type="checkbox" data-bucket="normal">
        <div class="legend-dot" style="background:var(--c-normal)"></div>
        <span>Normal (&lt;5 ft)</span>
      </label>
      <label class="legend-row filter-row" data-bucket="watch">
        <input type="checkbox" data-bucket="watch">
        <div class="legend-dot" style="background:var(--c-watch)"></div>
        <span>Watch (5–10 ft)</span>
      </label>
      <label class="legend-row filter-row" data-bucket="warning">
        <input type="checkbox" data-bucket="warning">
        <div class="legend-dot" style="background:var(--c-warning)"></div>
        <span>Warning (10–15 ft)</span>
      </label>
      <label class="legend-row filter-row" data-bucket="major">
        <input type="checkbox" checked data-bucket="major">
        <div class="legend-dot" style="background:var(--c-major)"></div>
        <span>Major (&gt;15 ft)</span>
      </label>
      <label class="legend-row filter-row" data-bucket="unknown">
        <input type="checkbox" data-bucket="unknown">
        <div class="legend-dot" style="background:var(--c-unknown)"></div>
        <span>Unknown</span>
      </label>
      <div class="legend-sep"></div>
      <div class="legend-row" style="margin-bottom:0.4rem; font-size:0.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;">State Filter</div>
      <div style="display:flex; gap:0.4rem; align-items:center; margin-bottom:0.1rem;">
        <select id="state-select" style="flex:1; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:4px; font-family:'DM Mono',monospace; font-size:0.65rem; padding:0.25rem 0.4rem; cursor:pointer;">
          <option value="ALL">All States</option>
        </select>
        <button id="state-clear" title="Clear" style="background:none; border:1px solid var(--border); border-radius:4px; color:var(--muted); font-size:0.65rem; padding:0.2rem 0.4rem; cursor:pointer;">✕</button>
      </div>
      <div class="legend-sep"></div>
      <div class="legend-row" style="margin-bottom:0.25rem; font-size:0.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;">Flood News</div>
      <label class="legend-row filter-row" id="news-24h-row" style="margin-bottom:0;">
        <input type="checkbox" id="news-24h-toggle">
        <div class="legend-dot" style="background:var(--c-news)"></div>
        <span>Last 24 hours only</span>
      </label>
    </div>

    <div id="loader">Fetching gauges…</div>
  </div>
</div>

  <!-- ── Flood Intelligence Chat ── -->
  <button id="chat-btn" title="Ask about flood risk">💬</button>

  <div id="chat-panel">
    <div id="chat-header">
      <span class="chat-title">⚡ FloodWire Intel</span>
      <span class="chat-subtitle">Powered by Ollama · Live gauge data</span>
    </div>
    <div id="chat-messages">
      <div class="chat-msg bot">Ask about flood risk near the selected gauge or current map view.</div>
    </div>
    <div id="chat-chips"></div>
    <div id="chat-context-bar" style="padding:0.35rem 0.75rem 0; display:none; align-items:center; gap:0.4rem; flex-wrap:wrap;">
      <span id="chat-context-pill" style="
        font-size:0.6rem; color:var(--accent);
        background:rgba(46,168,255,0.1); border:1px solid rgba(46,168,255,0.25);
        border-radius:99px; padding:0.15rem 0.55rem;
        white-space:nowrap; max-width:280px; overflow:hidden; text-overflow:ellipsis;
      "></span>
      <button id="chat-context-clear" title="Clear context" style="
        background:none; border:none; color:var(--muted);
        font-size:0.65rem; cursor:pointer; padding:0; line-height:1;
      ">✕</button>
    </div>
    <div id="chat-footer">
      <input id="chat-input" type="text" placeholder="Ask about current map view…" autocomplete="off" />
      <button id="chat-send">Ask</button>
    </div>
  </div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const FLOODS_GEOJSON = 'https://raw.githubusercontent.com/rmkenv/floodwire2/main/data/floods.geojson';
// National fetch — all active USGS stream gauges, gage height, last 2 hours
// ~8-10k sites; USGS IV supports CORS so we call directly from the browser
const USGS_NATIONAL  =
  'https://waterservices.usgs.gov/nwis/iv/' +
  '?format=json&parameterCd=00065&siteStatus=active&period=PT2H';

// ── Color map ─────────────────────────────────────────────────────────────────
const BUCKET_COLORS = {
  normal:  '#3fb68a',
  watch:   '#e8c547',
  warning: '#f07c3a',
  major:   '#e03c3c',
  unknown: '#555e6b'
};

// ── Init map ──────────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [38.5, -92.0],   // center of CONUS
  zoom: 4,
  zoomControl: true,
  preferCanvas: true        // faster for ~10k circle markers
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// ── Layers ────────────────────────────────────────────────────────────────────
const newsLayer = L.layerGroup().addTo(map);
let allNewsMarkers = []; // [{marker, ts}] — ts is Date or null

const gaugeCluster = L.markerClusterGroup({
  chunkedLoading: true,
  maxClusterRadius: 50,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  disableClusteringAtZoom: 10
});
gaugeCluster.addTo(map);

// ── Status helpers ────────────────────────────────────────────────────────────
const statusEl = document.getElementById('status');
const loaderEl = document.getElementById('loader');
let gaugeCount = 0;
let newsCount  = 0;

function setStatus(gaugeN, newsN) {
  if (gaugeN != null) gaugeCount = gaugeN;
  if (newsN  != null) newsCount  = newsN;
  statusEl.textContent = gaugeCount + ' gauges · ' + newsCount + ' news events';
}

// ── Gauge classification ──────────────────────────────────────────────────────
function classifyGauge(ft) {
  if (isNaN(ft) || ft < 0) return 'unknown';
  if (ft < 5)  return 'normal';
  if (ft < 10) return 'watch';
  if (ft < 15) return 'warning';
  return 'major';
}

// ── Load flood news (once) ────────────────────────────────────────────────────
function applyNewsFilter() {
  const only24h = document.getElementById('news-24h-toggle').checked;
  const cutoff  = Date.now() - 24 * 60 * 60 * 1000;
  newsLayer.clearLayers();
  let visible = 0;
  allNewsMarkers.forEach(({ marker, ts }) => {
    const show = !only24h || (ts && ts.getTime() >= cutoff);
    if (show) { newsLayer.addLayer(marker); visible++; }
  });
  const label = only24h ? visible + ' news (24h)' : allNewsMarkers.length + ' news events';
  statusEl.textContent = (allMarkers.length ? allMarkers.filter(({bucket}) =>
    [...document.querySelectorAll('.filter-row input:checked')].map(e=>e.dataset.bucket).includes(bucket)
  ).length + ' of ' + allMarkers.length + ' gauges · ' : '') + label;
}

async function loadFloodNews() {
  try {
    const res   = await fetch(FLOODS_GEOJSON);
    if (!res.ok) throw new Error(res.status);
    const gj    = await res.json();
    const feats = gj.features || [];
    feats.forEach(f => {
      const [lng, lat] = f.geometry.coordinates;
      const p  = f.properties;
      const ts = p.published_at ? new Date(p.published_at) : null;
      const marker = L.circleMarker([lat, lng], {
        radius: 7, fillColor: '#a855f7', color: '#fff',
        weight: 1.5, opacity: 1, fillOpacity: 0.85
      });
      const dt = ts
        ? ts.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        : '—';
      marker.bindPopup(
        '<div class="popup-title">' + escHtml(p.title || 'Flood Event') + '</div>' +
        '<div class="popup-row"><span class="popup-label">Source</span><span class="popup-val">' + escHtml(p.source || '—') + '</span></div>' +
        '<div class="popup-row"><span class="popup-label">Type</span><span class="popup-val">' + escHtml(p.flood_type || '—') + '</span></div>' +
        '<div class="popup-row"><span class="popup-label">Published</span><span class="popup-val">' + dt + '</span></div>' +
        '<a class="popup-link" href="' + escHtml(p.url || '#') + '" target="_blank" rel="noopener">→ Read article</a>'
      );
      allNewsMarkers.push({ marker, ts });
      newsLayer.addLayer(marker);
    });
    setStatus(null, feats.length);
  } catch (e) {
    console.error('Flood news error:', e);
  }
}

// ── Load ALL USGS gauges — fetch each state in parallel ───────────────────────
// The USGS IV service requires a "major filter" (stateCd, bBox, or sites list).
// A bare national query returns HTTP 400. Solution: fan out across all 50 states.
const US_STATES = [
  'AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA',
  'HI','ID','IL','IN','IA','KS','KY','LA','ME','MD',
  'MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ',
  'NM','NY','NC','ND','OH','OK','OR','PA','RI','SC',

function parseTimeSeries(series, param, state) {
  const markers = [];
  series.forEach(ts => {
    const site = ts.sourceInfo;
    const geo  = site?.geoLocation?.geogLocation;
    if (!geo) return;
    const lat = parseFloat(geo.latitude);
    const lng = parseFloat(geo.longitude);
    if (isNaN(lat) || isNaN(lng)) return;

    const vals   = ts.values?.[0]?.value || [];
    const latest = vals[vals.length - 1];
    const val    = latest ? parseFloat(latest.value) : NaN;
    if (isNaN(val) || val === -999999) return;

    const bucket   = classifyGauge(val);
    const color    = BUCKET_COLORS[bucket];
    const unit     = param === '00065' ? 'ft' : 'cfs';
    const siteCode = site.siteCode?.[0]?.value || '';
    const siteName = site.siteName || siteCode || 'USGS Gauge';
    const dt = latest?.dateTime
      ? new Date(latest.dateTime).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      : '—';

    const marker = L.circleMarker([lat, lng], {
      radius: 5, fillColor: color, color: '#fff',
      weight: 1, opacity: 1, fillOpacity: 0.9
    });
    marker.bindPopup(
      '<div class="popup-title">' + escHtml(siteName) + '</div>' +
      '<div class="popup-row"><span class="popup-label">' + (param === '00065' ? 'Gage height' : 'Streamflow') + '</span>' +
      '<span class="popup-val" style="color:' + color + '">' + val.toFixed(2) + ' ' + unit + '</span></div>' +
      '<div class="popup-row"><span class="popup-label">Status</span><span class="popup-val">' + bucket + '</span></div>' +
      '<div class="popup-row"><span class="popup-label">Updated</span><span class="popup-val">' + dt + '</span></div>' +
      (siteCode ? '<a class="popup-link" href="https://waterdata.usgs.gov/monitoring-location/' + siteCode + '" target="_blank" rel="noopener">→ USGS page</a>' : '')
    );
    // Set selected gauge context for chat when popup opens
    marker.on('popupopen', () => {
      selectedGauge = {
        name:     siteName,
        lat:      parseFloat(lat),
        lon:      parseFloat(lng),
        stage:    val,
        unit:     unit,
        bucket:   bucket,
        siteCode: siteCode,
        state:    site.siteState || site.state || ''
      };
      updateChatContextPill();
      // Auto-trigger assessment — slight delay so popup renders first
      setTimeout(() => autoAssessGauge(selectedGauge), 300);
    });
    marker.on('popupclose', () => {
      // Keep selectedGauge set — user may still want to ask about it
    });

    markers.push({ marker, bucket, state });
  });
  return markers;
}

async function loadGauges() {
  allMarkers = [];
  gaugeCluster.clearLayers();
  loaderEl.classList.add('visible');
  statusEl.textContent = 'Loading gauges (0 / ' + US_STATES.length + ')…';

  const param = currentParam;
  let totalCount = 0;
  let doneCount  = 0;

  // Fetch all states concurrently, add markers as each resolves
  const promises = US_STATES.map(async state => {
    try {
      const res = await fetch(buildStateUrl(state, param));
      if (!res.ok) return;
      const data   = await res.json();
      const series = data?.value?.timeSeries || [];
      const marks  = parseTimeSeries(series, param, state);
      marks.forEach(obj => {
        allMarkers.push(obj);
        gaugeCluster.addLayer(obj.marker);
        if (!activeStates.has(state)) gaugeCluster.removeLayer(obj.marker);
      });
      totalCount += marks.length;
    } catch (e) {
      // silently skip failed states
    } finally {
      doneCount++;
      statusEl.textContent = 'Loading gauges (' + doneCount + ' / ' + US_STATES.length + ')…';
    }
  });

  await Promise.all(promises);
  setStatus(totalCount, null);
  loaderEl.classList.remove('visible');
}

// ── Haversine distance (km) ───────────────────────────────────────────────────
function haversineMi(lat1, lon1, lat2, lon2) {
  const R = 3958.8;  // Earth radius in miles
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function featCoords(f) {
  const g = f.geometry;
  if (!g) return null;
  if (g.type === 'Point') return { lat: g.coordinates[1], lon: g.coordinates[0] };
  if (g.type === 'LineString') {
    const mid = Math.floor(g.coordinates.length / 2);
    return { lat: g.coordinates[mid][1], lon: g.coordinates[mid][0] };
  }
  if (g.type === 'Polygon') {
    return { lat: g.coordinates[0][0][1], lon: g.coordinates[0][0][0] };
  }
  return null;
}

// ── Nominatim geocode ─────────────────────────────────────────────────────────
async function geocode(query) {
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='
              + encodeURIComponent(query);
  const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
  const data = await res.json();
  if (!data.length) return null;
  return {
    lat:         parseFloat(data[0].lat),
    lon:         parseFloat(data[0].lon),
    displayName: data[0].display_name
  };
}

// ── Live Overpass query for nearby critical infrastructure ────────────────────
async function fetchNearbyInfrastructure(lat, lon) {
  const bb = 'around:' + OSM_RADIUS_M + ',' + lat + ',' + lon;
  const query = '[out:json][timeout:15];('
    + 'node[amenity=hospital]('         + bb + ');'
    + 'way[amenity=hospital]('          + bb + ');'
    + 'node[amenity=clinic]('           + bb + ');'
    + 'node[healthcare=hospital]('      + bb + ');'
    + 'node[amenity=fire_station]('     + bb + ');'
    + 'node[amenity=police]('           + bb + ');'
    + 'node[amenity=shelter]('          + bb + ');'
    + 'node[amenity=ambulance_station](' + bb + ');'

    + 'node[amenity=school]('           + bb + ');'
    + 'way[amenity=school]('            + bb + ');'
    + 'node[amenity=university]('       + bb + ');'
    + 'node[amenity=college]('          + bb + ');'
    + ');out center tags;';
  const tryOverpass = async (radiusM) => {
    const bbr = 'around:' + radiusM + ',' + lat + ',' + lon;
    const q = '[out:json][timeout:25];('
      + 'node[amenity=hospital]('          + bbr + ');'
      + 'way[amenity=hospital]('           + bbr + ');'
      + 'node[amenity=clinic]('            + bbr + ');'
      + 'node[healthcare=hospital]('       + bbr + ');'
      + 'node[amenity=fire_station]('      + bbr + ');'
      + 'node[amenity=police]('            + bbr + ');'
      + 'node[amenity=shelter]('           + bbr + ');'
      + 'node[amenity=ambulance_station](' + bbr + ');'
      + 'node[amenity=school]('            + bbr + ');'
      + 'way[amenity=school]('             + bbr + ');'
      + 'node[amenity=university]('        + bbr + ');'
      + 'node[amenity=college]('           + bbr + ');'
      + ');out center tags;';
    const res = await fetch(OVERPASS_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body:    'data=' + encodeURIComponent(q),
      signal:  AbortSignal.timeout(25000)
    });
    if (!res.ok) return [];
    const data = await res.json();
    console.debug('[Overpass] radius=' + radiusM + ' returned:', data.elements?.length);
    return data.elements || [];
  };

  try {
    // Try 25km first, expand to 50km if nothing found
    let elements = await tryOverpass(25000);
    if (elements.length === 0) {
      console.debug('[Overpass] retrying with 50km radius');
      elements = await tryOverpass(50000);
    }
    return elements.map(el => {
      const c = el.center || el;
      const p = el.tags   || {};
      const elLat = parseFloat(c.lat), elLon = parseFloat(c.lon);
      if (isNaN(elLat) || isNaN(elLon)) return null;
      return {
        geometry:   { type: 'Point', coordinates: [elLon, elLat] },
        properties: {
          name:       p.name       || '',
          ref:        p.ref        || '',   // route number e.g. "US 258", "NC 125"
          amenity:    p.amenity    || '',
          healthcare: p.healthcare || '',
          operator:   p.operator   || '',
        }
      };
    }).filter(Boolean);
  } catch(e) {
    console.warn('[Chat] Overpass failed:', e.message);
    return [];
  }
}

// ── Spatial context builder ───────────────────────────────────────────────────
function buildContext(lat, lon, locationName, liveOSM) {
  liveOSM = liveOSM || [];
  // Nearest gauges within radius, sorted by distance
  const seenGauges = new Set();
  const nearGauges = gaugeFeatures
    .map(f => {
      const c = featCoords(f);
      if (!c) return null;
      return { ...f.properties, _dist: haversineMi(lat, lon, c.lat, c.lon) };
    })
    .filter(g => {
      if (!g || g._dist > SEARCH_RADIUS_MI) return false;
      // Deduplicate by site_id first, then site_name — one entry per physical station
      const key = g.site_id || g.site_no || g.site_name || (g.lat + ',' + g.lon);
      if (seenGauges.has(key)) return false;
      seenGauges.add(key);
      return true;
    })
    .sort((a, b) => a._dist - b._dist)
    .slice(0, 5);

  // Recent flood events within radius
  const nearFloods = floodFeatures
    .map(f => {
      const c = featCoords(f);
      if (!c) return null;
      return { ...f.properties, _dist: haversineMi(lat, lon, c.lat, c.lon) };
    })
    .filter(f => f && f._dist <= SEARCH_RADIUS_MI)
    .sort((a, b) => a._dist - b._dist)
    .slice(0, 5);

  // Nearby critical infrastructure — prefer live Overpass results over static file
  const osmSource = (liveOSM && liveOSM.length) ? liveOSM : osmFeatures;
  const nearOSM = osmSource
    .map(f => {
      const c = featCoords(f);
      if (!c) return null;
      const p   = f.properties;
      const amenity = (p.amenity    || '').toLowerCase();
      const hw      = (p.highway    || '').toLowerCase();
      const hc      = (p.healthcare || '').toLowerCase();
      const br      = (p.bridge     || '').toLowerCase();
      // Derive a clean category
      let category = 'infrastructure';
      if (['hospital','clinic','doctors'].includes(amenity) || hc === 'hospital') category = 'hospital';
      else if (amenity === 'fire_station')    category = 'fire_station';
      else if (amenity === 'police')          category = 'police';
      else if (amenity === 'shelter')         category = 'shelter';
      else if (amenity === 'ambulance_station') category = 'ambulance';
      else if (['school','university','college'].includes(amenity)) category = 'school';
      // Roads often have ref (US-17) not name — use ref as fallback
      const name = p.name || p.ref || p.operator || amenity || hw || '';
      if (!name && !['road','bridge'].includes(category)) return null;  // skip unnamed non-roads
      const displayName = name || amenity || 'unnamed';
      return { name: displayName, category, _dist: haversineMi(lat, lon, c.lat, c.lon) };
    })
    .filter(o => o && o._dist <= SEARCH_RADIUS_MI)
    .sort((a, b) => a._dist - b._dist)
    .filter((o, i, arr) => arr.findIndex(x => x.name === o.name && x.category === o.category) === i)  // dedup by name+category
    .slice(0, 15);

  // Format gauge context
  const gaugeCtx = nearGauges.length
    ? nearGauges.map(g => {
        const name   = g.site_name || g.name || g.site_no || 'Unknown gauge';
        const stage  = g.stage_ft  ?? g.stage ?? g.value ?? '?';
        const status = g.tier      || g.flood_stage || g.status || 'unknown';
        const action = g.action_stage ?? '?';
        const flood  = g.flood_stage  ?? '?';
        const major  = g.major_stage  ?? '?';
        return `  - ${name} (${g._dist.toFixed(1)} mi): stage=${stage} ft, tier=${status}, action=${action} ft, flood=${flood} ft, major=${major} ft`;
      }).join("\n")
    : '  No USGS gauges within ' + SEARCH_RADIUS_MI + ' miles.';

  const floodCtx = nearFloods.length
    ? nearFloods.map(f => {
        const title = f.title || f.headline || f.name || 'Flood event';
        const date  = f.date  || f.published || f.fetched_at || 'recent';
        return `  - "${title}" (${f._dist.toFixed(1)} mi, ${date})`;
      }).join("\n")
    : '  No recent flood news events within ' + SEARCH_RADIUS_MI + ' miles.';

  const byCategory = (cat) => nearOSM.filter(o => o.category === cat);
  const fmtGroup = (label, items) => items.length
    ? `  ${label}: ${items.map(o => o.name + ' (' + o._dist.toFixed(1) + ' mi)').join(', ')}`
    : null;

  const osmCtx = nearOSM.length
    ? [
        fmtGroup('Hospitals/Clinics', byCategory('hospital')),
        fmtGroup('Schools/Universities', byCategory('school')),
        fmtGroup('Fire Stations',     byCategory('fire_station')),
        fmtGroup('Police',            byCategory('police')),
        fmtGroup('Shelters',          byCategory('shelter')),
        fmtGroup('Ambulance',         byCategory('ambulance')),
      ].filter(Boolean).join("\n")
    : '';

  // If user clicked a specific gauge, surface it prominently in context
  const primaryGauge = selectedGauge && haversineMi(lat, lon, selectedGauge.lat, selectedGauge.lon) < 3
    ? `SELECTED GAUGE (user clicked): ${selectedGauge.name} — ${selectedGauge.stage} ${selectedGauge.unit}, status: ${selectedGauge.bucket}\n\n`
    : '';

  // Give the LLM geographic context so it can reason about nearby cities even if OSM has no hospitals
  const geoNote = `LOCATION: lat ${lat.toFixed(4)}, lon ${lon.toFixed(4)} — ${locationName}\n`;

  const osmSection = nearOSM.length && osmCtx
    ? `NEARBY CRITICAL INFRASTRUCTURE (within ${SEARCH_RADIUS_MI} miles):\n${osmCtx}\n\n`
    : '';

  return {
    nearGauges,
    nearFloods,
    context: `You are FloodWire Intel, a flood risk assessment assistant backed by live USGS gauge data.
You apply a structured assessment framework to live data to answer flood risk questions.
The user is asking about: "${locationName}".

${geoNote}
${primaryGauge}
=== LIVE DATA ===

GAUGE READINGS (within ${SEARCH_RADIUS_MI} miles):
${gaugeCtx}

RECENT FLOOD NEWS (within ${SEARCH_RADIUS_MI} miles):
${floodCtx}

${osmSection}
=== ASSESSMENT FRAMEWORK ===
Apply each step using only the live data above. Skip steps where data is absent.

STEP 1 - GAUGE STATUS: State the gauge name, current stage (ft), and tier (normal/watch/warning/major). If action stage or flood stage thresholds are known, state the gap in feet.

STEP 2 - HYDROLOGY: Note any flood news as evidence of upstream rainfall or basin conditions. State whether the current stage implies active, receding, or building flood conditions.

STEP 3 - EXPOSURE: List nearby hospitals, schools, and emergency services at risk by name and distance. If none found within range, name the nearest population center likely to have these facilities.

STEP 4 - RISK VERDICT: State LOW / ELEVATED / HIGH. Justify with stage vs threshold, proximity of facilities, and corroborating flood news.

=== OUTPUT FORMAT ===
Two parts, blank line between them:

PART 1 - NEARBY (skip entirely if no facilities found):
- Hospitals/Clinics: [name (X.X mi), ...]
- Schools/Universities: [name (X.X mi), ...]
- Emergency Services: [name (X.X mi), ...]
Omit any line where that category is empty.

PART 2 - ASSESSMENT:
2-4 sentences. Lead with risk verdict, gauge name, stage, and tier.
Reference specific facilities at risk. State gap to flood stage in feet if known.
If no facilities found, name nearest city with likely medical or school facilities.
Use miles only for distances to specific named facilities. Do NOT reference the search radius number. Do not mention roads or bridges.`
  };
}

// ── Gauge card renderer ───────────────────────────────────────────────────────
function stageColor(status) {
  const s = (status || '').toLowerCase();
  if (s.includes('major'))                          return 'var(--c-major)';
  if (s.includes('warning') || s.includes('warn'))  return 'var(--c-warning)';
  if (s.includes('watch')   || s.includes('action'))return 'var(--c-watch)';
  if (s.includes('normal')  || s.includes('low'))   return 'var(--c-normal)';
  return 'var(--c-unknown)';
}

function renderGaugeCard(gauges) {
  if (!gauges.length) return null;
  const el = document.createElement('div');
  el.className = 'gauge-card';

  let html = '<div class="gauge-card-title">📍 Nearest Gauges</div>';
  gauges.slice(0, 3).forEach(g => {
    const name   = escHtml(g.site_name || g.name || g.site_no || 'Gauge');
    const stage  = g.stage_ft ?? g.stage ?? g.value ?? '?';
    const status = g.tier || g.flood_stage || g.status || 'unknown';
    const color  = stageColor(status);
    const dist   = g._dist.toFixed(1);
    html +=
      '<div class="gauge-card-row">' +
        '<span class="gauge-card-label">' + name + ' (' + dist + ' mi)</span>' +
        '<span class="gauge-card-val" style="color:' + color + '">' +
          escHtml(String(stage)) + ' ft · ' + escHtml(status) +
        '</span>' +
      '</div>';
  });
  el.innerHTML = html;
  return el;
}

// ── Message rendering ─────────────────────────────────────────────────────────
function appendMsg(text, role, typing = false) {
  const el = document.createElement('div');
  el.className = 'chat-msg ' + role + (typing ? ' typing' : '');
  el.textContent = text;
  chatMsgs.appendChild(el);
  chatMsgs.scrollTop = chatMsgs.scrollHeight;
  return el;
}

// ── Ollama call (via /api/chat Vercel proxy, non-streaming) ──────────────────
async function streamOllama(systemPrompt, userQuery, targetEl) {
  const res = await fetch(OLLAMA_PROXY, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model:    OLLAMA_MODEL,
      stream:   false,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user',   content: userQuery }
      ]
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error((err.error || 'HTTP ' + res.status) + (err.detail ? ': ' + err.detail : ''));
  }

  const data = await res.json();
  const text = data?.message?.content || data?.response || '(no response)';
  targetEl.classList.remove('typing');
  targetEl.textContent = text;
  chatMsgs.scrollTop   = chatMsgs.scrollHeight;
  return text;
}

// ── Context pill updater ─────────────────────────────────────────────────────
function updateChatContextPill() {
  const bar  = document.getElementById('chat-context-bar');
  const pill = document.getElementById('chat-context-pill');
  if (!bar || !pill) return;

  let label = '';
  if (selectedGauge) {
    const stageStr = selectedGauge.stage != null
      ? ' · ' + (typeof selectedGauge.stage === 'number' ? selectedGauge.stage.toFixed(2) : selectedGauge.stage) + ' ' + selectedGauge.unit
      : '';
    const bucketUpper = (selectedGauge.bucket || '').toUpperCase();
    label = '📍 ' + selectedGauge.name + stageStr + ' ft (' + bucketUpper + ')';
  } else if (mapViewContext) {
    label = '🗺 Map view: ' + mapViewContext.lat.toFixed(3) + ', ' + mapViewContext.lon.toFixed(3)
            + ' (' + mapViewContext.label + ')';
  }

  if (label) {
    pill.textContent = label;
    bar.style.display = 'flex';
  } else {
    bar.style.display = 'none';
  }
}

document.getElementById('chat-context-clear')?.addEventListener('click', () => {
  selectedGauge = null;
  lastAutoGauge = null;
  renderChips(null);
  updateChatContextPill();
});

// ── NWPS trend fetch ──────────────────────────────────────────────────────────
async function fetchGaugeTrend(siteCode) {
  if (!siteCode) return null;
  try {
    // USGS IV service — last 6 hours of readings to determine trend
    const url = 'https://waterservices.usgs.gov/nwis/iv/?format=json&sites='
      + siteCode + '&parameterCd=00065&period=PT6H&siteStatus=active';
    const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
    if (!res.ok) return null;
    const data = await res.json();
    const series = data?.value?.timeSeries?.[0]?.values?.[0]?.value;
    if (!series || series.length < 2) return null;
    const first = parseFloat(series[0].value);
    const last  = parseFloat(series[series.length - 1].value);
    const delta = last - first;
    if (Math.abs(delta) < 0.05) return { trend: 'steady', delta: 0 };
    return delta > 0
      ? { trend: 'rising',  delta: +delta.toFixed(2) }
      : { trend: 'falling', delta: +Math.abs(delta).toFixed(2) };
  } catch(e) {
    console.warn('[Trend] fetch failed:', e.message);
    return null;
  }
}

// ── Suggestion chips ──────────────────────────────────────────────────────────
function renderChips(gauge) {
  const el = document.getElementById('chat-chips');
  if (!el) return;
  el.innerHTML = '';
  if (!gauge) return;

  const bucket = (gauge.bucket || '').toLowerCase();
  const chips = [];

  // Always show these
  chips.push('What does this gauge reading mean?');
  chips.push('Are any hospitals at risk?');
  chips.push('Are any schools at risk?');

  // Contextual chips based on flood tier
  if (bucket === 'major') {
    chips.push('How severe is major flood stage?');
    chips.push('What should residents do now?');
  } else if (bucket === 'warning') {
    chips.push('Is flooding expected to worsen?');
    chips.push('What actions should be taken?');
  } else if (bucket === 'watch') {
    chips.push('Should I be concerned?');
  }

  chips.slice(0, 4).forEach(text => {
    const btn = document.createElement('button');
    btn.className = 'chat-chip';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      chatInput.value = text;
      sendChat();
    });
    el.appendChild(btn);
  });
}

// ── Plain-language gauge explanation ─────────────────────────────────────────
function gaugeExplainerMsg(gauge, trend) {
  const bucket  = (gauge.bucket || 'unknown').toLowerCase();
  const stage   = typeof gauge.stage === 'number' ? gauge.stage.toFixed(2) : gauge.stage;
  const name    = gauge.name || 'This gauge';

  const tierText = {
    normal:  'water levels are normal — no flooding expected.',
    watch:   'water is rising and approaching levels where flooding may begin. Stay alert.',
    warning: 'flooding is occurring or imminent. Low-lying areas and roads may be affected.',
    major:   'significant flooding is occurring. Structures, roads, and critical facilities may be inundated.'
  }[bucket] || 'flood status is unknown.';

  const trendText = !trend ? '' :
    trend.trend === 'rising'  ? ` The river has risen ${trend.delta} ft in the last 6 hours.` :
    trend.trend === 'falling' ? ` The river has fallen ${trend.delta} ft in the last 6 hours — conditions may be improving.` :
    ' Water levels are holding steady.';

  const trendBadge = !trend ? '' :
    `<span class="trend-badge trend-${trend.trend}">${
      trend.trend === 'rising' ? '▲ Rising' :
      trend.trend === 'falling' ? '▼ Falling' : '● Steady'
    }</span>`;

  return `<strong>${name}</strong> reads <strong>${stage} ft</strong>${trendBadge}<br><br>`
       + `At <strong>${bucket}</strong> stage, ${tierText}${trendText}`;
}

// ── Auto-assess on gauge click ────────────────────────────────────────────────
let lastAutoGauge = null;

async function autoAssessGauge(gauge) {
  if (!gauge || chatBusy) return;
  if (lastAutoGauge && lastAutoGauge.siteCode === gauge.siteCode) return; // don't re-fire same gauge
  lastAutoGauge = gauge;

  // Open chat panel
  if (!chatOpen) {
    chatOpen = true;
    chatPanel.classList.add('open');
    if (!chatDataReady) loadChatData();
  }

  // Clear old chips while loading
  const chipsEl = document.getElementById('chat-chips');
  if (chipsEl) chipsEl.innerHTML = '';

  chatBusy = true;
  chatSend.disabled = true;

  // Fetch trend in parallel with infra
  const [trend, liveOSM] = await Promise.all([
    fetchGaugeTrend(gauge.siteCode),
    fetchNearbyInfrastructure(gauge.lat, gauge.lon)
  ]);

  // Show plain-language explainer card
  const explainerEl = appendMsg('', 'bot');
  explainerEl.innerHTML = gaugeExplainerMsg(gauge, trend);

  // Build context and run assessment
  if (!chatDataReady) await loadChatData();
  const { nearGauges, nearFloods, context } = buildContext(
    gauge.lat, gauge.lon,
    gauge.name + (gauge.state ? ', ' + gauge.state : ''),
    liveOSM
  );

  // Gauge card
  const gaugesForCard = nearGauges.length ? nearGauges : [{
    site_name: gauge.name, stage_ft: gauge.stage,
    tier: gauge.bucket, _dist: 0
  }];
  const card = renderGaugeCard(gaugesForCard);
  if (card) chatMsgs.appendChild(card);

  // LLM assessment
  const answerEl = appendMsg('', 'bot', true);
  try {
    const raw = await streamOllama(context, 'Give me a full flood risk assessment for this location including nearby hospitals, schools, and emergency services.', answerEl);
    if (raw && raw.includes('-')) {
      answerEl.innerHTML = raw
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\n/g,'<br>')
        .replace(/- (Hospitals|Schools|Emergency|Clinics|Universities)/g,
          '<span style="color:var(--accent);font-weight:700;">◆ $1</span>');
    }
  } catch(e) {
    answerEl.textContent = '⚠ Assessment unavailable: ' + e.message;
    answerEl.classList.remove('typing');
  }

  // Render suggestion chips
  renderChips(gauge);

  chatBusy = false;
  chatSend.disabled = false;
  chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

// ── Main send handler ─────────────────────────────────────────────────────────
async function sendChat() {
  const query = chatInput.value.trim();
  if (!query || chatBusy) return;

  chatBusy = true;
  chatSend.disabled = true;
  chatInput.value   = '';

  appendMsg(query, 'user');

  // Wait for data if still loading
  if (!chatDataReady) {
    const waitEl = appendMsg('Loading flood data…', 'bot', true);
    await loadChatData();
    waitEl.remove();
  }

  // Resolve location — use selected gauge or map center if no explicit place named
  let geo = null;

  // Try gauge context first
  if (selectedGauge) {
    geo = {
      lat:         selectedGauge.lat,
      lon:         selectedGauge.lon,
      displayName: selectedGauge.name + (selectedGauge.state ? ', ' + selectedGauge.state : '')
    };
  }

  // Try geocoding the query text
  if (!geo) {
    const geocodeEl = appendMsg('Locating "' + query + '"…', 'bot', true);
    try {
      geo = await geocode(query);
    } catch(e) {
      geocodeEl.textContent = '⚠ Geocoding failed: ' + e.message;
      geocodeEl.classList.remove('typing');
      chatBusy = false; chatSend.disabled = false; return;
    }
    geocodeEl.remove();
  }

  // Fall back to map view center
  if (!geo && mapViewContext) {
    geo = {
      lat:         mapViewContext.lat,
      lon:         mapViewContext.lon,
      displayName: 'current map view (' + mapViewContext.lat.toFixed(3) + ', ' + mapViewContext.lon.toFixed(3) + ')'
    };
  }

  if (!geo) {
    appendMsg('⚠ Could not determine location. Try typing a place name, zoom the map, or click a gauge.', 'bot');
    chatBusy = false; chatSend.disabled = false; return;
  }

  // Fetch live OSM infrastructure
  const liveInfraEl = appendMsg('Querying nearby hospitals and infrastructure…', 'bot', true);
  const liveOSM = await fetchNearbyInfrastructure(geo.lat, geo.lon);
  liveInfraEl.remove();

  // Build spatial context
  const { nearGauges, nearFloods, context } = buildContext(geo.lat, geo.lon, geo.displayName, liveOSM);

  // If a gauge was clicked, make sure it appears first in the card
  let gaugesForCard = nearGauges;
  if (selectedGauge && (nearGauges.length === 0 || nearGauges[0].site_name !== selectedGauge.name)) {
    const sg = {
      site_name: selectedGauge.name,
      stage_ft:  selectedGauge.stage,
      tier:      selectedGauge.bucket,
      _dist:     haversineMi(geo.lat, geo.lon, selectedGauge.lat, selectedGauge.lon)
    };
    gaugesForCard = [sg, ...nearGauges.filter(g => g.site_name !== selectedGauge.name)].slice(0, 3);
  }

  // Render gauge card
  const card = renderGaugeCard(gaugesForCard);
  if (card) {
    chatMsgs.appendChild(card);
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
  } else if (!nearGauges.length) {
    appendMsg('⚠ No USGS gauges found within ' + SEARCH_RADIUS_MI + ' miles — assessment may be limited.', 'bot');
  }

  // Stream LLM answer
  const answerEl = appendMsg('', 'bot', true);
  try {
    const raw = await streamOllama(context, query, answerEl);
    // Style bullet lines
    if (raw && raw.includes('•')) {
      answerEl.innerHTML = raw
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\n/g,'<br>')
        .replace(/• /g,'<span style="color:var(--accent);font-weight:700;margin-right:0.3rem;">◆</span>');
    }
  } catch(e) {
    answerEl.textContent = '⚠ AI unavailable: ' + e.message;
    answerEl.classList.remove('typing');
  }

  // Re-render chips based on current gauge after manual query
  if (selectedGauge) renderChips(selectedGauge);

  chatBusy = false;
  chatSend.disabled = false;
  chatInput.focus();
}

chatSend.addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) sendChat(); });

</script>
